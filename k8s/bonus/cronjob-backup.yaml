# BONUS EXERCISE: CronJobs + shared volume access modes.
#
# Backs up the SQLite file from the SAME PVC the bwe Deployment uses, on a
# schedule, into a scratch emptyDir. This is a deliberate discussion prompt:
# the PVC is ReadWriteOnce, so whether this CronJob's pod can mount it *at the
# same time* as the running bwe pod depends entirely on your CSI driver/node
# topology - with some drivers both pods must land on the same node, with
# others a second attach fails outright. Ask "how would you fix this for real?"
# (answer: RWX-capable storage, or have the app push backups out itself
# instead of sharing the volume).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bwe-backup
  namespace: bwe-demo
  labels:
    app.kubernetes.io/name: bwe
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bwe-backup
        spec:
          restartPolicy: OnFailure
          # Same uid/gid as the app so the job can read the PVC files.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              # The app image already ships better-sqlite3, so no extra image is
              # needed. Keep this tag in step with k8s/03-deployment.yaml.
              image: ghcr.io/script-repo/bwe:eb92f383346331c0d63053209bb4436b4a7f8eb4
              imagePullPolicy: IfNotPresent
              # The app runs SQLite in WAL mode (server/db.js), so recent commits
              # live in bwe.db-wal until a checkpoint. A plain `cp bwe.db` can
              # miss them or catch a torn page. SQLite's online backup API reads
              # the db and its WAL as one consistent snapshot, and works on a
              # read-only mount while the app keeps writing.
              command:
                - node
                - -e
                - |
                  const fs = require('fs');
                  const Database = require('/app/server/node_modules/better-sqlite3');
                  const src = '/data/bwe.db';
                  if (!fs.existsSync(src)) {
                    console.log('No /data/bwe.db yet - nothing to back up.');
                    process.exit(0);
                  }
                  const ts = new Date().toISOString().replace(/[-:]/g, '').replace('T', '-').slice(0, 15);
                  const dest = `/backup/bwe-${ts}.db`;
                  const db = new Database(src, { readonly: true, fileMustExist: true });
                  db.backup(dest)
                    .then(() => {
                      db.close();
                      // The copy inherits WAL mode; switch it to a rollback
                      // journal so the backup is one self-contained file.
                      const copy = new Database(dest);
                      copy.pragma('journal_mode = DELETE');
                      const check = copy.pragma('integrity_check', { simple: true });
                      copy.close();
                      if (check !== 'ok') throw new Error(`integrity_check failed: ${check}`);
                      console.log(`Backed up ${src} -> ${dest} (integrity ok)`);
                      console.log(fs.readdirSync('/backup').join('\n'));
                    })
                    .catch((err) => {
                      console.error('Backup failed:', err.message);
                      process.exit(1);
                    });
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: bwe-data
            # emptyDir here is intentional: it isolates the exercise to
            # "can we even attach the source PVC read-only from a second pod"
            # without needing a second real PVC.
            - name: backup
              emptyDir: {}
