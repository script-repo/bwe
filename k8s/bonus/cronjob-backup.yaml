# BONUS EXERCISE: CronJobs + shared volume access modes.
#
# Backs up the SQLite file from the SAME PVC the bwe Deployment uses, on a
# schedule, into a scratch emptyDir. This is a deliberate discussion prompt:
# the PVC is ReadWriteOnce, so whether this CronJob's pod can mount it *at the
# same time* as the running bwe pod depends entirely on your CSI driver/node
# topology - with some drivers both pods must land on the same node, with
# others a second attach fails outright. Ask "how would you fix this for real?"
# (answer: RWX-capable storage, or have the app push backups out itself
# instead of sharing the volume).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bwe-backup
  namespace: bwe-demo
  labels:
    app.kubernetes.io/name: bwe
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bwe-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  set -e
                  ts=$(date +%Y%m%d-%H%M%S)
                  if [ -f /data/bwe.db ]; then
                    cp /data/bwe.db "/backup/bwe-$ts.db"
                    echo "Backed up /data/bwe.db -> /backup/bwe-$ts.db"
                  else
                    echo "No /data/bwe.db yet - nothing to back up."
                  fi
                  ls -la /backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: bwe-data
            # emptyDir here is intentional: it isolates the exercise to
            # "can we even attach the source PVC read-only from a second pod"
            # without needing a second real PVC.
            - name: backup
              emptyDir: {}
