# Single-replica Deployment mounting two volumes:
#   /data   - the PVC (read-write): SQLite settings + run history
#   /config - the ConfigMap (read-only): default seed data + PORT
#
# Deliberately kept at replicas: 1. Scaling this past 1 is a teaching moment:
# ReadWriteOnce constrains writable mounts to one node, not one pod, so the
# observed result depends on scheduling and the CSI driver. See k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bwe
  namespace: bwe-demo
  labels:
    app.kubernetes.io/name: bwe
spec:
  replicas: 1
  # Recreate stops the old pod before starting the new one. With the default
  # RollingUpdate, a rollout starts the new pod first: on another node it
  # hangs on a Multi-Attach error for the RWO volume, and on the same node two
  # processes briefly write the same SQLite file. Expect a few seconds of
  # downtime per rollout instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bwe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bwe
    spec:
      # fsGroup makes the PVC mount group-writable by uid 1000 (the "node"
      # user the image runs as) - a very common real-world PVC permissions
      # gotcha worth calling out explicitly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bwe
          # Pinned to the immutable GHCR image produced by the repository's
          # tested main-branch workflow. Update this digest-like commit tag when
          # intentionally rolling out a newer application build.
          image: ghcr.io/script-repo/bwe:eb92f383346331c0d63053209bb4436b4a7f8eb4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: bwe-config
                  key: PORT
            - name: DATA_DIR
              value: /data
            - name: SEED_FILE
              value: /config/seed-data.json
            # Downward API: proves to the class that the pod identity is
            # ephemeral even though the data behind it isn't.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # The image filesystem is read-only; only /data (PVC) and /tmp
          # (scratch space for SQLite temp files) are writable.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bwe-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: seed
          configMap:
            name: bwe-config
            items:
              - key: seed-data.json
                path: seed-data.json
